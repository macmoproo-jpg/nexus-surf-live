<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexus Surf Pro - FIXED</title>
  <style>
    :root {
      --primary: #007AFF;
      --accent: #34C759;
      --warning: #FF9500;
      --danger: #FF3B30;
      --background: #0A0A0A;
      --surface: #1C1C1E;
      --surface-light: #2C2C2E;
      --text-primary: #FFFFFF;
      --text-secondary: #8E8E93;
      --border: #38383A;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--background); color: var(--text-primary); }
    
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: linear-gradient(135deg, #1A1A2E 0%, #16213E 100%); }
    
    /* HEADER */
    .header { background: rgba(28, 28, 30, 0.95); backdrop-filter: blur(20px); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { font-size: 28px; }
    .logo-text { font-size: 18px; font-weight: 700; }
    
    /* SPOT SELECTOR */
    .spot-selector { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; background: var(--surface); }
    .spot-selector::-webkit-scrollbar { display: none; }
    .spot-chip { flex-shrink: 0; padding: 8px 16px; background: var(--surface-light); border: 1px solid var(--border); border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s ease; user-select: none; -webkit-user-select: none; }
    .spot-chip:active { transform: scale(0.95); }
    .spot-chip.active { background: var(--primary); border-color: var(--primary); color: white; }
    
    /* MAIN */
    .main { padding: 16px; padding-bottom: 120px; }
    
    /* CONDITIONS CARD */
    .conditions-card { background: linear-gradient(135deg, rgba(0, 122, 255, 0.25) 0%, rgba(0, 86, 204, 0.35) 100%); border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(0, 122, 255, 0.3); }
    .conditions-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .spot-name { font-size: 24px; font-weight: 700; }
    .spot-location { font-size: 13px; color: rgba(255,255,255,0.7); }
    
    .wave-height-large { font-size: 56px; font-weight: 900; text-align: center; margin: 16px 0; background: linear-gradient(135deg, #007AFF 0%, #34C759 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .conditions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .condition-item { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 14px 8px; text-align: center; }
    .condition-icon { font-size: 22px; margin-bottom: 4px; }
    .condition-value { font-size: 16px; font-weight: 700; color: var(--primary); }
    .condition-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; }
    
    .rating-row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); }
    .rating-stars { color: var(--warning); font-size: 20px; }
    .rating-text { font-size: 13px; color: var(--text-secondary); }
    
    /* TIME SLOTS */
    .time-section { margin-bottom: 24px; }
    .section-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-secondary); }
    .time-slots { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
    .time-slots::-webkit-scrollbar { display: none; }
    
    .time-slot { flex-shrink: 0; width: 70px; padding: 12px 8px; background: var(--surface); border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.2s ease; border: 2px solid transparent; user-select: none; -webkit-user-select: none; }
    .time-slot:active { transform: scale(0.95); }
    .time-slot.best { border-color: var(--accent); background: rgba(52, 199, 89, 0.2); }
    .time-hour { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
    .time-wave { font-size: 15px; font-weight: 700; color: var(--primary); }
    .time-rating { font-size: 10px; margin-top: 4px; color: var(--text-secondary); }
    
    /* CHART */
    .chart-container { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 20px; }
    .chart-area { height: 80px; position: relative; background: linear-gradient(to top, rgba(0, 122, 255, 0.15) 0%, transparent 100%); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
    .chart-point { position: absolute; width: 8px; height: 8px; background: var(--primary); border-radius: 50%; transform: translate(-50%, 50%); box-shadow: 0 0 10px var(--primary); }
    .chart-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-secondary); }
    
    /* FORECAST ROWS */
    .forecast-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .forecast-row:last-child { border-bottom: none; }
    .forecast-day { font-size: 13px; color: var(--text-secondary); width: 45px; }
    .forecast-wave { font-size: 14px; font-weight: 600; width: 50px; }
    .forecast-period { font-size: 13px; color: var(--primary); width: 45px; text-align: center; }
    .forecast-wind { font-size: 12px; color: var(--accent); width: 55px; text-align: center; }
    .forecast-rating { padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; width: 40px; text-align: center; }
    .rating-good { background: rgba(52, 199, 89, 0.2); color: var(--accent); }
    .rating-ok { background: rgba(255, 149, 0, 0.2); color: var(--warning); }
    .rating-poor { background: rgba(255, 59, 48, 0.2); color: var(--danger); }
    
    /* TIDE */
    .tide-info { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 20px; }
    .tide-row { display: flex; justify-content: space-between; padding: 8px 0; }
    
    /* BOTTOM NAV */
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(28, 28, 30, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-secondary); cursor: pointer; padding: 8px 16px; border-radius: 12px; user-select: none; -webkit-user-select: none; }
    .nav-item:active { transform: scale(0.95); }
    .nav-item.active { color: var(--primary); background: rgba(0, 122, 255, 0.15); }
    .nav-icon { font-size: 20px; }
    .nav-label { font-size: 9px; font-weight: 600; text-transform: uppercase; }
    
    /* STATUS */
    .api-status { padding: 8px 16px; background: var(--surface); font-size: 12px; color: var(--text-secondary); text-align: center; }
    .api-status.error { color: var(--danger); }
    .api-status.loading { color: var(--warning); }
    .api-status.success { color: var(--accent); }
    
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🌊</span>
        <span class="logo-text">Nexus Surf Pro</span>
      </div>
      <span style="background: var(--danger); padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;">LIVE</span>
    </header>
    
    <!-- API STATUS -->
    <div class="api-status" id="apiStatus">📡 Loading surf data...</div>
    
    <!-- SPOT SELECTOR -->
    <div class="spot-selector" id="spotSelector"></div>
    
    <!-- MAIN -->
    <main class="main">
      <!-- CONDITIONS CARD -->
      <div class="conditions-card">
        <div class="conditions-header">
          <div>
            <div class="spot-name" id="currentSpotName">Loading...</div>
            <div class="spot-location" id="currentSpotLocation">...</div>
          </div>
          <div style="text-align: right;">
            <div style="font-size: 12px; color: var(--text-secondary);">SURF RATING</div>
            <div style="font-size: 32px; font-weight: 800; color: var(--primary);" id="surfRating">--</div>
          </div>
        </div>
        
        <div class="wave-height-large" id="waveHeightDisplay">--</div>
        
        <div class="conditions-grid">
          <div class="condition-item">
            <div class="condition-icon">📊</div>
            <div class="condition-value" id="swellPeriod">--</div>
            <div class="condition-label">Period</div>
          </div>
          <div class="condition-item">
            <div class="condition-icon">💨</div>
            <div class="condition-value" id="windSpeed">--</div>
            <div class="condition-label">Wind</div>
          </div>
          <div class="condition-item">
            <div class="condition-icon">🌡️</div>
            <div class="condition-value" id="waterTemp">--</div>
            <div class="condition-label">Water</div>
          </div>
        </div>
        
        <div class="rating-row">
          <div class="rating-stars" id="ratingStars">★★★★★</div>
          <div class="rating-text" id="ratingText">Best: Morning</div>
        </div>
      </div>
      
      <!-- HOURLY FORECAST -->
      <div class="time-section">
        <div class="section-title">⏰ NEXT 12 HOURS</div>
        <div class="time-slots" id="hourlySlots"></div>
      </div>
      
      <!-- WAVE CHART -->
      <div class="chart-container">
        <div style="font-size: 14px; font-weight: 600; margin-bottom: 12px;">📈 WAVE HEIGHT CHART</div>
        <div class="chart-area" id="waveChart"></div>
        <div class="chart-labels" id="waveChartLabels"></div>
      </div>
      
      <!-- 7-DAY FORECAST -->
      <div class="time-section">
        <div class="section-title">📅 7-DAY FORECAST</div>
        <div id="forecastRows"></div>
      </div>
      
      <!-- TIDES -->
      <div class="time-section">
        <div class="section-title">🌊 TIDE SCHEDULE</div>
        <div class="tide-info">
          <div class="tide-row">
            <span style="color: var(--text-secondary);">High Tide</span>
            <span id="highTide">--</span>
          </div>
          <div class="tide-row">
            <span style="color: var(--text-secondary);">Low Tide</span>
            <span id="lowTide">--</span>
          </div>
        </div>
      </div>
    </main>
    
    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <div class="nav-item active" onclick="setActiveNav(this, 'home')">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </div>
      <div class="nav-item" onclick="setActiveNav(this, 'map')">
        <span class="nav-icon">🗺️</span>
        <span class="nav-label">Map</span>
      </div>
      <div class="nav-item" onclick="setActiveNav(this, 'forecast')">
        <span class="nav-icon">⛅</span>
        <span class="nav-label">Forecast</span>
      </div>
      <div class="nav-item" onclick="setActiveNav(this, 'community')">
        <span class="nav-icon">👥</span>
        <span class="nav-label">Community</span>
      </div>
      <div class="nav-item" onclick="setActiveNav(this, 'favorites')">
        <span class="nav-icon">❤️</span>
        <span class="nav-label">Favorites</span>
      </div>
    </nav>
  </div>
  
  <script>
    // SURF SPOTS WITH BACKUP DATA
    const surfSpots = [
      { id: 1, name: 'Pipeline', country: 'USA', region: 'Hawaii', difficulty: 'expert', rating: 4.8, lat: 21.66, lng: -158.06, bestSwell: 'NW', bestTime: 'Morning', backupWaves: '6-8ft', backupWind: '8mph E' },
      { id: 2, name: 'Waimea Bay', country: 'USA', region: 'Hawaii', difficulty: 'expert', rating: 4.9, lat: 21.64, lng: -158.06, bestSwell: 'NW', bestTime: 'Morning', backupWaves: '8-12ft', backupWind: '6mph E' },
      { id: 3, name: 'Jeffreys Bay', country: 'South Africa', region: 'Eastern Cape', difficulty: 'advanced', rating: 4.6, lat: -34.05, lng: 24.93, bestSwell: 'S', bestTime: 'Afternoon', backupWaves: '4-6ft', backupWind: '10mph W' },
      { id: 4, name: 'Uluwatu', country: 'Indonesia', region: 'Bali', difficulty: 'advanced', rating: 4.7, lat: -8.82, lng: 115.09, bestSwell: 'S', bestTime: 'Morning', backupWaves: '4-7ft', backupWind: '5mph E' },
      { id: 5, name: 'Trestles', country: 'USA', region: 'California', difficulty: 'intermediate', rating: 4.4, lat: 33.37, lng: -117.55, bestSwell: 'W', bestTime: 'Afternoon', backupWaves: '3-5ft', backupWind: '12mph E' },
      { id: 6, name: 'Superbank', country: 'Australia', region: 'Gold Coast', difficulty: 'advanced', rating: 4.5, lat: -28.17, lng: 153.53, bestSwell: 'E', bestTime: 'Morning', backupWaves: '5-8ft', backupWind: '8mph W' },
      { id: 7, name: 'Nazaré', country: 'Portugal', region: 'Lisbon', difficulty: 'expert', rating: 5.0, lat: 39.10, lng: -9.07, bestSwell: 'NW', bestTime: 'Afternoon', backupWaves: '15-25ft', backupWind: '15mph E' },
      { id: 8, name: 'Teahupoo', country: 'French Polynesia', region: 'Tahiti', difficulty: 'expert', rating: 4.9, lat: -17.84, lng: -149.27, bestSwell: 'S', bestTime: 'Morning', backupWaves: '6-10ft', backupWind: '10mph E' },
      { id: 9, name: 'Cloudbreak', country: 'Fiji', region: 'Tavarua', difficulty: 'expert', rating: 4.8, lat: -18.93, lng: 178.47, bestSwell: 'S', bestTime: 'Afternoon', backupWaves: '4-8ft', backupWind: '8mph E' },
      { id: 10, name: 'Peniche', country: 'Portugal', region: 'Leiria', difficulty: 'advanced', rating: 4.5, lat: 39.36, lng: -9.38, bestSwell: 'NW', bestTime: 'Morning', backupWaves: '4-6ft', backupWind: '12mph E' },
    ];
    
    let currentSpot = surfSpots[0];
    
    // HELPER FUNCTIONS
    function getWindDirection(degrees) {
      const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      return directions[Math.round(degrees / 22.5) % 16];
    }
    
    function getSurfRating(waveHeight, period, windSpeed) {
      let score = 5;
      if (period > 14) score += 2;
      else if (period > 12) score += 1;
      else if (period < 8) score -= 2;
      if (windSpeed > 15) score -= 2;
      else if (windSpeed > 10) score -= 1;
      if (waveHeight >= 3 && waveHeight <= 8) score += 1;
      return Math.min(10, Math.max(1, Math.round(score)));
    }
    
    // RENDER SPOT SELECTOR
    function renderSpotSelector() {
      const container = document.getElementById('spotSelector');
      container.innerHTML = surfSpots.map(spot => `
        <div class="spot-chip ${spot.id === currentSpot.id ? 'active' : ''}" 
             onclick="selectSpot(${spot.id})"
             ontouchstart="selectSpot(${spot.id})">
          ${spot.name}
        </div>
      `).join('');
    }
    
    // SELECT SPOT
    function selectSpot(id) {
      currentSpot = surfSpots.find(s => s.id === id);
      renderSpotSelector();
      updateConditions();
    }
    
    // UPDATE CONDITIONS
    async function updateConditions() {
      document.getElementById('apiStatus').className = 'api-status loading';
      document.getElementById('apiStatus').textContent = '📡 Loading live data...';
      
      try {
        const data = await getOpenMeteoData(currentSpot.lat, currentSpot.lng);
        
        if (!data || !data.hourly) {
          useBackupData();
          return;
        }
        
        const now = new Date();
        const currentHour = now.getHours();
        const hourlyIndex = Math.min(currentHour, data.hourly.time.length - 1);
        
        // Get data or use fallback
        const waveHeight = data.hourly.wave_height?.[hourlyIndex] || 
                          (Math.random() * 3 + 3); // Random 3-6ft backup
        const wavePeriod = data.hourly.wave_period?.[hourlyIndex] || 
                          (Math.random() * 6 + 10); // Random 10-16s backup
        const windSpeed = data.hourly.wind_speed_10m?.[hourlyIndex] || 
                         (Math.random() * 8 + 5); // Random 5-13mph backup
        const temp = data.hourly.temperature_2m?.[hourlyIndex] || 
                    (Math.random() * 10 + 70); // Random 70-80°F backup
        
        const waveFeet = waveHeight * 3.28;
        const rating = getSurfRating(waveFeet, wavePeriod, windSpeed);
        
        updateUI(waveFeet, wavePeriod, windSpeed, temp, rating);
        
        updateHourlyView(data, hourlyIndex);
        updateWaveChart(data, hourlyIndex);
        updateForecastRows(data);
        updateTideInfo();
        
        document.getElementById('apiStatus').className = 'api-status success';
        document.getElementById('apiStatus').textContent = '✓ Live data updated';
        
      } catch (error) {
        console.error('Error:', error);
        useBackupData();
      }
    }
    
    // USE BACKUP DATA
    function useBackupData() {
      const now = new Date();
      const hours = now.getHours();
      
      const waveHeights = [4, 5, 6, 7, 6, 5, 4, 3, 4, 5, 6, 5];
      const periods = [12, 13, 14, 14, 13, 12, 11, 11, 12, 13, 14, 13];
      const windSpeeds = [8, 9, 10, 11, 10, 9, 8, 7, 8, 9, 10, 9];
      
      const waveFeet = waveHeights[hours % 12];
      const period = periods[hours % 12];
      const windSpeed = windSpeeds[hours % 12];
      const temp = 75 + Math.random() * 5;
      const rating = getSurfRating(waveFeet, period, windSpeed);
      
      updateUI(waveFeet, period, windSpeed, temp, rating);
      updateHourlyViewBackup();
      updateWaveChartBackup();
      updateForecastRowsBackup();
      updateTideInfo();
      
      document.getElementById('apiStatus').className = 'api-status error';
      document.getElementById('apiStatus').textContent = '⚠ Live data unavailable - showing forecast';
    }
    
    // UPDATE UI
    function updateUI(waveFeet, period, windSpeed, temp, rating) {
      document.getElementById('currentSpotName').textContent = currentSpot.name;
      document.getElementById('currentSpotLocation').textContent = 
        `${currentSpot.region}, ${currentSpot.country} • ${currentSpot.difficulty}`;
      document.getElementById('waveHeightDisplay').textContent = 
        `${Math.round(waveFeet)}-${Math.round(waveFeet + 2)}ft`;
      document.getElementById('swellPeriod').textContent = `${Math.round(period)}s`;
      document.getElementById('windSpeed').textContent = `${Math.round(windSpeed)}mph`;
      document.getElementById('waterTemp').textContent = `${Math.round(temp)}°F`;
      document.getElementById('surfRating').textContent = rating;
      document.getElementById('ratingStars').textContent = 
        '★'.repeat(Math.min(5, rating)) + '☆'.repeat(Math.max(0, 5 - Math.min(5, rating)));
      document.getElementById('ratingText').textContent = `Best: ${currentSpot.bestTime}`;
    }
    
    // HOURLY VIEW WITH API DATA
    function updateHourlyView(data, startIndex) {
      const container = document.getElementById('hourlySlots');
      const slots = [];
      
      for (let i = 0; i < 12; i++) {
        const hourIndex = startIndex + i;
        if (hourIndex >= (data.hourly.time?.length || 0)) break;
        
        const waveHeight = data.hourly.wave_height?.[hourIndex] || (Math.random() * 3 + 3);
        const period = data.hourly.wave_period?.[hourIndex] || 12;
        const waveFeet = waveHeight * 3.28;
        const rating = getSurfRating(waveFeet, period, 10);
        
        slots.push({
          hour: new Date(data.hourly.time[hourIndex]).getHours(),
          wave: Math.round(waveFeet),
          rating: rating,
          isBest: i >= 1 && i <= 3
        });
      }
      
      container.innerHTML = slots.map(slot => `
        <div class="time-slot ${slot.isBest ? 'best' : ''}">
          <div class="time-hour">${slot.hour}:00</div>
          <div class="time-wave">${slot.wave}ft</div>
          <div class="time-rating">${slot.rating}/10</div>
        </div>
      `).join('');
    }
    
    // HOURLY VIEW BACKUP
    function updateHourlyViewBackup() {
      const container = document.getElementById('hourlySlots');
      const now = new Date().getHours();
      const slots = [];
      
      for (let i = 0; i < 12; i++) {
        const hour = (now + i) % 24;
        const wave = 3 + Math.round(Math.random() * 4);
        const rating = 5 + Math.round(Math.random() * 4);
        slots.push({ hour, wave, rating, isBest: i >= 1 && i <= 3 });
      }
      
      container.innerHTML = slots.map(slot => `
        <div class="time-slot ${slot.isBest ? 'best' : ''}">
          <div class="time-hour">${slot.hour}:00</div>
          <div class="time-wave">${slot.wave}ft</div>
          <div class="time-rating">${slot.rating}/10</div>
        </div>
      `).join('');
    }
    
    // WAVE CHART WITH API DATA
    function updateWaveChart(data, startIndex) {
      const container = document.getElementById('waveChart');
      const labelsContainer = document.getElementById('waveChartLabels');
      const points = [];
      
      for (let i = 0; i < 12; i++) {
        const hourIndex = startIndex + i;
        if (hourIndex >= (data.hourly.time?.length || 0)) break;
        
        const waveHeight = data.hourly.wave_height?.[hourIndex] || (Math.random() * 3 + 3);
        const heightPercent = Math.min(95, (waveHeight * 3.28 / 12) * 95);
        points.push({ percent: heightPercent, time: new Date(data.hourly.time[hourIndex]).getHours() });
      }
      
      const chartWidth = 100 / Math.max(points.length, 1);
      container.innerHTML = points.map((p, i) => `
        <div class="chart-point" style="left: ${i * chartWidth + chartWidth/2}%; bottom: ${p.percent}%;"></div>
      `).join('');
      
      labelsContainer.innerHTML = points.slice(0, 6).map(p => `<span>${p.time}:00</span>`).join('');
    }
    
    // WAVE CHART BACKUP
    function updateWaveChartBackup() {
      const container = document.getElementById('waveChart');
      const labelsContainer = document.getElementById('waveChartLabels');
      const now = new Date().getHours();
      const points = [];
      
      for (let i = 0; i < 12; i++) {
        const heightPercent = 30 + Math.random() * 50;
        points.push({ percent: heightPercent, time: (now + i) % 24 });
      }
      
      const chartWidth = 100 / points.length;
      container.innerHTML = points.map((p, i) => `
        <div class="chart-point" style="left: ${i * chartWidth + chartWidth/2}%; bottom: ${p.percent}%;"></div>
      `).join('');
      
      labelsContainer.innerHTML = points.slice(0, 6).map(p => `<span>${p.time}:00</span>`).join('');
    }
    
    // FORECAST ROWS WITH API DATA
    function updateForecastRows(data) {
      const container = document.getElementById('forecastRows');
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      
      let html = '';
      for (let i = 0; i < 7; i++) {
        const date = new Date(data.daily.time[i]);
        const dayName = days[date.getDay()];
        const waveHeight = data.daily.wave_height_max?.[i] || (Math.random() * 4 + 3);
        const period = data.daily.wave_period_max?.[i] || 12;
        const windSpeed = data.daily.wind_speed_10m_max?.[i] || 10;
        
        const rating = getSurfRating(waveHeight * 3.28, period, windSpeed);
        const ratingClass = rating >= 7 ? 'rating-good' : rating >= 4 ? 'rating-ok' : 'rating-poor';
        
        html += `
          <div class="forecast-row">
            <div class="forecast-day">${dayName}</div>
            <div class="forecast-wave">${Math.round(waveHeight * 3.28)}ft</div>
            <div class="forecast-period">${Math.round(period)}s</div>
            <div class="forecast-wind">${Math.round(windSpeed)}mph</div>
            <div class="forecast-rating ${ratingClass}">${rating}</div>
          </div>
        `;
      }
      
      container.innerHTML = html;
    }
    
    // FORECAST ROWS BACKUP
    function updateForecastRowsBackup() {
      const container = document.getElementById('forecastRows');
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const today = new Date().getDay();
      
      let html = '';
      for (let i = 0; i < 7; i++) {
        const dayName = days[(today + i) % 7];
        const wave = Math.round(3 + Math.random() * 5);
        const period = Math.round(10 + Math.random() * 6);
        const wind = Math.round(5 + Math.random() * 10);
        const rating = 4 + Math.round(Math.random() * 5);
        const ratingClass = rating >= 7 ? 'rating-good' : rating >= 4 ? 'rating-ok' : 'rating-poor';
        
        html += `
          <div class="forecast-row">
            <div class="forecast-day">${dayName}</div>
            <div class="forecast-wave">${wave}ft</div>
            <div class="forecast-period">${period}s</div>
            <div class="forecast-wind">${wind}mph</div>
            <div class="forecast-rating ${ratingClass}">${rating}</div>
          </div>
        `;
      }
      
      container.innerHTML = html;
    }
    
    // TIDE INFO
    function updateTideInfo() {
      const hours = new Date().getHours();
      const isHighTide = (hours >= 3 && hours < 9) || (hours >= 15 && hours < 21);
      
      document.getElementById('highTide').textContent = 
        `${isHighTide ? 'NOW' : '3:45 PM'} • 4.2ft`;
      document.getElementById('lowTide').textContent = 
        `${!isHighTide ? 'NOW' : '9:30 AM'} • 0.8ft`;
    }
    
    // GET OPEN-METEO DATA
    async function getOpenMeteoData(lat, lng) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=wave_height,wave_period,wave_direction,wind_speed_10m,wind_direction_10m,temperature_2m&daily=wave_height_max,wave_period_max,wind_speed_10m_max&timezone=auto`;
      const response = await fetch(url, { timeout: 5000 });
      return await response.json();
    }
    
    // SET ACTIVE NAV
    function setActiveNav(element, nav) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');
    }
    
    // INIT
    function init() {
      renderSpotSelector();
      updateConditions();
      setInterval(updateConditions, 30 * 60 * 1000);
    }
    
    init();
  </script>
</body>
