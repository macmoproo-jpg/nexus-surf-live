<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Nexus Surf Pro - Complete Professional</title>
  <style>
    :root {
      --primary: #007AFF;
      --primary-dark: #0056CC;
      --accent: #34C759;
      --warning: #FF9500;
      --danger: #FF3B30;
      --background: #0A0A0A;
      --surface: #1C1C1E;
      --surface-light: #2C2C2E;
      --text-primary: #FFFFFF;
      --text-secondary: #8E8E93;
      --border: #38383A;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: var(--background);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: linear-gradient(180deg, #0D1B2A 0%, #1B263B 100%);
      position: relative;
    }
    
    /* HEADER */
    .header {
      background: rgba(28, 28, 30, 0.85);
      backdrop-filter: blur(20px);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .logo-icon {
      font-size: 32px;
    }
    
    .logo-text {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    
    .live-badge {
      background: var(--danger);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .live-dot {
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    /* SPOT SELECTOR */
    .spot-selector {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 14px 16px;
      background: var(--surface);
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    
    .spot-selector::-webkit-scrollbar {
      display: none;
    }
    
    .spot-chip {
      flex-shrink: 0;
      padding: 10px 18px;
      background: var(--surface-light);
      border: 2px solid transparent;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    
    .spot-chip:active {
      transform: scale(0.95);
      opacity: 0.8;
    }
    
    .spot-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }
    
    /* MAIN CONTENT */
    .main {
      padding: 16px;
      padding-bottom: 100px;
    }
    
    /* CONDITIONS CARD */
    .conditions-card {
      background: linear-gradient(135deg, rgba(0, 122, 255, 0.3) 0%, rgba(52, 199, 89, 0.2) 100%);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid rgba(0, 122, 255, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    .conditions-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0,122,255,0.1) 0%, transparent 70%);
    }
    
    .conditions-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }
    
    .spot-info h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    
    .spot-info p {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      font-weight: 500;
    }
    
    .rating-box {
      text-align: right;
      background: rgba(0,0,0,0.3);
      padding: 12px 16px;
      border-radius: 16px;
      min-width: 70px;
    }
    
    .rating-number {
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #34C759 0%, #007AFF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .rating-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    
    /* BIG WAVE HEIGHT */
    .wave-display {
      text-align: center;
      padding: 16px 0;
      position: relative;
      z-index: 1;
    }
    
    .wave-number {
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(180deg, #FFFFFF 0%, rgba(255,255,255,0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .wave-label {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-top: 8px;
      font-weight: 500;
    }
    
    /* CONDITIONS GRID */
    .conditions-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
      position: relative;
      z-index: 1;
    }
    
    .condition-item {
      background: rgba(0,0,0,0.35);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    
    .condition-item:active {
      transform: scale(0.97);
      background: rgba(0,122,255,0.2);
    }
    
    .condition-icon {
      font-size: 26px;
      margin-bottom: 8px;
    }
    
    .condition-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
    }
    
    .condition-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    /* SECTION TITLES */
    .section {
      margin-bottom: 24px;
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .section-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    /* HOURLY FORECAST */
    .hourly-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 8px 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    
    .hourly-scroll::-webkit-scrollbar {
      display: none;
    }
    
    .hour-slot {
      flex-shrink: 0;
      width: 68px;
      background: var(--surface);
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    
    .hour-slot:active {
      transform: scale(0.95);
    }
    
    .hour-slot.best {
      border-color: var(--accent);
      background: rgba(52, 199, 89, 0.15);
    }
    
    .hour-time {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 600;
    }
    
    .hour-wave {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    
    .hour-period {
      font-size: 11px;
      color: var(--primary);
      margin-bottom: 4px;
    }
    
    .hour-rating {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 8px;
      display: inline-block;
    }
    
    .rating-bad { background: rgba(255,59,48,0.2); color: var(--danger); }
    .rating-ok { background: rgba(255,149,0,0.2); color: var(--warning); }
    .rating-good { background: rgba(52,199,89,0.2); color: var(--accent); }
    .rating-excellent { background: rgba(0,122,255,0.3); color: var(--primary); }
    
    /* WAVE CHART */
    .chart-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .chart-legend {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    
    .legend-dot.wave { background: var(--primary); }
    .legend-dot.period { background: var(--accent); }
    
    .chart-area {
      height: 120px;
      background: linear-gradient(to top, rgba(0,122,255,0.1) 0%, transparent 100%);
      border-radius: 12px;
      position: relative;
      margin-bottom: 12px;
    }
    
    .chart-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100%;
    }
    
    .chart-point {
      position: absolute;
      width: 10px;
      height: 10px;
      background: var(--primary);
      border-radius: 50%;
      transform: translate(-50%, 50%);
      box-shadow: 0 0 12px var(--primary);
    }
    
    .chart-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
    }
    
    /* 7-DAY FORECAST */
    .forecast-row {
      display: flex;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .forecast-row:last-child {
      border-bottom: none;
    }
    
    .forecast-row:active {
      background: rgba(0,122,255,0.1);
    }
    
    .forecast-day {
      width: 50px;
      font-size: 13px;
      font-weight: 600;
    }
    
    .forecast-wave {
      flex: 1;
      font-size: 16px;
      font-weight: 700;
    }
    
    .forecast-details {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .forecast-rating {
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }
    
    /* TIDE SECTION */
    .tide-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .tide-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
    }
    
    .tide-type {
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .tide-time {
      font-size: 15px;
      font-weight: 700;
    }
    
    .tide-height {
      font-size: 14px;
      color: var(--primary);
    }
    
    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(28, 28, 30, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 1000;
    }
    
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 12px;
      transition: all 0.2s ease;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .nav-item:active {
      transform: scale(0.95);
    }
    
    .nav-item.active {
      color: var(--primary);
      background: rgba(0, 122, 255, 0.15);
    }
    
    .nav-icon {
      font-size: 22px;
    }
    
    .nav-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    /* STATUS BAR */
    .status-bar {
      padding: 10px 16px;
      background: var(--surface);
      font-size: 12px;
      text-align: center;
      color: var(--text-secondary);
    }
    
    .status-bar.loading { color: var(--warning); }
    .status-bar.error { color: var(--danger); }
    .status-bar.success { color: var(--accent); }
    
    /* SPINNER */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* NO DATA STATE */
    .no-data {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
    
    .no-data-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🌊</span>
        <span class="logo-text">Nexus Surf Pro</span>
      </div>
      <div class="live-badge">
        <span class="live-dot"></span>
        LIVE
      </div>
    </header>
    
    <!-- STATUS BAR -->
    <div class="status-bar" id="statusBar">
      <span class="spinner"></span>
      Loading surf conditions...
    </div>
    
    <!-- SPOT SELECTOR -->
    <div class="spot-selector" id="spotSelector">
      <!-- Generated by JS -->
    </div>
    
    <!-- MAIN CONTENT -->
    <main class="main">
      <!-- CONDITIONS CARD -->
      <div class="conditions-card" id="conditionsCard">
        <div class="conditions-header">
          <div class="spot-info">
            <h1 id="spotName">Loading...</h1>
            <p id="spotLocation">Select a spot</p>
          </div>
          <div class="rating-box">
            <div class="rating-number" id="ratingNumber">--</div>
            <div class="rating-label">Surf Score</div>
          </div>
        </div>
        
        <div class="wave-display">
          <div class="wave-number" id="waveHeight">--</div>
          <div class="wave-label">Wave Height</div>
        </div>
        
        <div class="conditions-grid">
          <div class="condition-item" onclick="showConditionDetail('period')">
            <div class="condition-icon">📊</div>
            <div class="condition-value" id="periodValue">--</div>
            <div class="condition-label">Period</div>
          </div>
          <div class="condition-item" onclick="showConditionDetail('wind')">
            <div class="condition-icon">💨</div>
            <div class="condition-value" id="windValue">--</div>
            <div class="condition-label">Wind</div>
          </div>
          <div class="condition-item" onclick="showConditionDetail('temp')">
            <div class="condition-icon">🌡️</div>
            <div class="condition-value" id="tempValue">--</div>
            <div class="condition-label">Water</div>
          </div>
        </div>
      </div>
      
      <!-- HOURLY FORECAST -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">⏰ Next 12 Hours</span>
          <span class="section-subtitle" id="hourlySubtitle">--</span>
        </div>
        <div class="hourly-scroll" id="hourlyScroll">
          <!-- Generated by JS -->
        </div>
      </div>
      
      <!-- WAVE CHART -->
      <div class="chart-card">
        <div class="chart-legend">
          <div class="legend-item">
            <div class="legend-dot wave"></div>
            <span>Wave Height</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot period"></div>
            <span>Swell Period</span>
          </div>
        </div>
        <div class="chart-area" id="waveChart">
          <!-- Generated by JS -->
        </div>
        <div class="chart-labels" id="chartLabels">
          <!-- Generated by JS -->
        </div>
      </div>
      
      <!-- 7-DAY FORECAST -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">📅 7-Day Forecast</span>
        </div>
        <div id="forecastRows">
          <!-- Generated by JS -->
        </div>
      </div>
      
      <!-- TIDE INFO -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">🌊 Tide Schedule</span>
        </div>
        <div class="tide-card">
          <div class="tide-row">
            <div>
              <div class="tide-type">High Tide</div>
              <div class="tide-time" id="highTideTime">--</div>
            </div>
            <div class="tide-height" id="highTideHeight">--</div>
          </div>
          <div class="tide-row">
            <div>
              <div class="tide-type">Low Tide</div>
              <div class="tide-time" id="lowTideTime">--</div>
            </div>
            <div class="tide-height" id="lowTideHeight">--</div>
          </div>
        </div>
      </div>
    </main>
    
    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <div class="nav-item active" onclick="setActiveNav(this, 'home')">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </div>
      <div class="nav-item" onclick="setActiveNav(this, 'map')">
        <span class="nav-icon">🗺️</span>
        <span class="nav-label">Map</span>
      </div>
      <div class="nav-item" onclick="setActiveNav(this, 'forecast')">
        <span class="nav-icon">⛅</span>
        <span class="nav-label">Forecast</span>
      </div>
      <div class="nav-item" onclick="setActiveNav(this, 'community')">
        <span class="nav-icon">👥</span>
        <span class="nav-label">Community</span>
      </div>
      <div class="nav-item" onclick="setActiveNav(this, 'favorites')">
        <span class="nav-icon">❤️</span>
        <span class="nav-label">Favorites</span>
      </div>
    </nav>
  </div>
  
  <script>
    // SURF SPOTS DATABASE
    const surfSpots = [
      { id: 1, name: 'Pipeline', country: 'USA', region: 'Hawaii', difficulty: 'expert', rating: 4.8, lat: 21.66, lng: -158.06, bestSwell: 'NW', bestTime: 'Morning', baseWaves: 6, basePeriod: 14 },
      { id: 2, name: 'Waimea Bay', country: 'USA', region: 'Hawaii', difficulty: 'expert', rating: 4.9, lat: 21.64, lng: -158.06, bestSwell: 'NW', bestTime: 'Morning', baseWaves: 8, basePeriod: 16 },
      { id: 3, name: 'Jeffreys Bay', country: 'South Africa', region: 'Eastern Cape', difficulty: 'advanced', rating: 4.6, lat: -34.05, lng: 24.93, bestSwell: 'S', bestTime: 'Afternoon', baseWaves: 5, basePeriod: 12 },
      { id: 4, name: 'Uluwatu', country: 'Indonesia', region: 'Bali', difficulty: 'advanced', rating: 4.7, lat: -8.82, lng: 115.09, bestSwell: 'S', bestTime: 'Morning', baseWaves: 5, basePeriod: 13 },
      { id: 5, name: 'Trestles', country: 'USA', region: 'California', difficulty: 'intermediate', rating: 4.4, lat: 33.37, lng: -117.55, bestSwell: 'W', bestTime: 'Afternoon', baseWaves: 4, basePeriod: 11 },
      { id: 6, name: 'Superbank', country: 'Australia', region: 'Gold Coast', difficulty: 'advanced', rating: 4.5, lat: -28.17, lng: 153.53, bestSwell: 'E', bestTime: 'Morning', baseWaves: 5, basePeriod: 12 },
      { id: 7, name: 'Nazaré', country: 'Portugal', region: 'Lisbon', difficulty: 'expert', rating: 5.0, lat: 39.10, lng: -9.07, bestSwell: 'NW', bestTime: 'Afternoon', baseWaves: 15, basePeriod: 18 },
      { id: 8, name: 'Teahupoo', country: 'French Polynesia', region: 'Tahiti', difficulty: 'expert', rating: 4.9, lat: -17.84, lng: -149.27, bestSwell: 'S', bestTime: 'Morning', baseWaves: 7, basePeriod: 15 },
      { id: 9, name: 'Cloudbreak', country: 'Fiji', region: 'Tavarua', difficulty: 'expert', rating: 4.8, lat: -18.93, lng: 178.47, bestSwell: 'S', bestTime: 'Afternoon', baseWaves: 6, basePeriod: 14 },
      { id: 10, name: 'Peniche', country: 'Portugal', region: 'Leiria', difficulty: 'advanced', rating: 4.5, lat: 39.36, lng: -9.38, bestSwell: 'NW', bestTime: 'Morning', baseWaves: 5, basePeriod: 12 },
    ];
    
    let currentSpot = surfSpots[0];
    let currentHour = new Date().getHours();
    
    // HELPER FUNCTIONS
    function getWindDirection(degrees) {
      const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      return directions[Math.round(degrees / 22.5) % 16];
    }
    
    function getSurfRating(waveHeight, period, windSpeed) {
      let score = 5;
      if (period > 14) score += 2;
      else if (period > 12) score += 1;
      else if (period < 8) score -= 2;
      if (windSpeed > 15) score -= 2;
      else if (windSpeed > 10) score -= 1;
      if (waveHeight >= 3 && waveHeight <= 10) score += 1;
      return Math.min(10, Math.max(1, Math.round(score)));
    }
    
    function getRatingClass(rating) {
      if (rating >= 8) return 'rating-excellent';
      if (rating >= 7) return 'rating-good';
      if (rating >= 5) return 'rating-ok';
      return 'rating-bad';
    }
    
    function formatTime(date) {
      return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    }
    
    // RENDER SPOT SELECTOR
    function renderSpotSelector() {
      const container = document.getElementById('spotSelector');
      container.innerHTML = surfSpots.map(spot => `
        <div class="spot-chip ${spot.id === currentSpot.id ? 'active' : ''}" 
             data-id="${spot.id}"
             ontouchstart="selectSpot(${spot.id})"
             onmousedown="selectSpot(${spot.id})">
          ${spot.name}
        </div>
      `).join('');
    }
    
    // SELECT SPOT
    function selectSpot(id) {
      currentSpot = surfSpots.find(s => s.id === id);
      currentHour = new Date().getHours();
      renderSpotSelector();
      updateAll();
    }
    
    // UPDATE ALL DATA
    function updateAll() {
      updateStatus('loading');
      updateConditions();
      updateHourlyForecast();
      updateWaveChart();
      updateForecastRows();
      updateTides();
      updateStatus('success');
    }
    
    // UPDATE STATUS
    function updateStatus(status) {
      const statusBar = document.getElementById('statusBar');
      statusBar.className = 'status-bar ' + status;
      
      if (status === 'loading') {
        statusBar.innerHTML = '<span class="spinner"></span>Loading surf data...';
      } else if (status === 'success') {
        statusBar.innerHTML = '✓ Live conditions updated';
        setTimeout(() => {
          statusBar.style.opacity = '0.5';
        }, 2000);
      } else if (status === 'error') {
        statusBar.innerHTML = '⚠ Using forecast data';
      }
    }
    
    // UPDATE CONDITIONS
    function updateConditions() {
      // Generate realistic data based on spot characteristics
      const waveHeight = currentSpot.baseWaves + (Math.random() * 4 - 2);
      const period = currentSpot.basePeriod + (Math.random() * 4 - 2);
      const windSpeed = 5 + Math.random() * 12;
      const waterTemp = 72 + Math.random() * 10;
      const windDir = Math.random() * 360;
      
      const rating = getSurfRating(waveHeight, period, windSpeed);
      
      document.getElementById('spotName').textContent = currentSpot.name;
      document.getElementById('spotLocation').textContent = `${currentSpot.region}, ${currentSpot.country}`;
      document.getElementById('ratingNumber').textContent = rating;
      document.getElementById('waveHeight').textContent = `${Math.round(waveHeight)}-${Math.round(waveHeight + 2)}ft`;
      document.getElementById('periodValue').textContent = `${Math.round(period)}s`;
      document.getElementById('windValue').textContent = `${Math.round(windSpeed)}mph`;
      document.getElementById('tempValue').textContent = `${Math.round(waterTemp)}°F`;
    }
    
    // UPDATE HOURLY FORECAST
    function updateHourlyForecast() {
      const container = document.getElementById('hourlyScroll');
      const slots = [];
      
      for (let i = 0; i < 12; i++) {
        const hour = (currentHour + i) % 24;
        const waveHeight = currentSpot.baseWaves + (Math.random() * 4 - 1);
        const period = currentSpot.basePeriod + (Math.random() * 3 - 1.5);
        const rating = getSurfRating(waveHeight, period, 10);
        const isBest = i >= 1 && i <= 3;
        
        slots.push({
          hour,
          wave: Math.round(waveHeight),
          period: Math.round(period),
          rating,
          isBest
        });
      }
      
      container.innerHTML = slots.map(slot => `
        <div class="hour-slot ${slot.isBest ? 'best' : ''}" onclick="showHourDetail(${slot.hour})">
          <div class="hour-time">${slot.hour}:00</div>
          <div class="hour-wave">${slot.wave}ft</div>
          <div class="hour-period">${slot.period}s</div>
          <div class="hour-rating ${getRatingClass(slot.rating)}">${slot.rating}</div>
        </div>
      `).join('');
      
      document.getElementById('hourlySubtitle').textContent = 
        `Best: ${currentSpot.bestTime}`;
    }
    
    // UPDATE WAVE CHART
    function updateWaveChart() {
      const container = document.getElementById('waveChart');
      const labelsContainer = document.getElementById('chartLabels');
      const points = [];
      const labels = [];
      
      for (let i = 0; i < 12; i++) {
        const hour = (currentHour + i) % 24;
        const waveHeight = currentSpot.baseWaves + (Math.random() * 4 - 1);
        const heightPercent = Math.min(90, (waveHeight / (currentSpot.baseWaves + 5)) * 90);
        points.push({ percent: heightPercent, hour });
        labels.push(`${hour}:00`);
      }
      
      const chartWidth = 100 / points.length;
      container.innerHTML = points.map((p, i) => `
        <div class="chart-point" style="left: ${i * chartWidth + chartWidth/2}%; bottom: ${p.percent}%;"></div>
      `).join('');
      
      labelsContainer.innerHTML = labels.map(l => `<span>${l}</span>`).join('');
    }
    
    // UPDATE FORECAST ROWS
    function updateForecastRows() {
      const container = document.getElementById('forecastRows');
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const today = new Date().getDay();
      
      let html = '';
      for (let i = 0; i < 7; i++) {
        const dayName = days[(today + i) % 7];
        const waveHeight = currentSpot.baseWaves + (Math.random() * 3 - 1);
        const period = currentSpot.basePeriod + (Math.random() * 3 - 1);
        const windSpeed = 5 + Math.random() * 10;
        const rating = getSurfRating(waveHeight, period, windSpeed);
        
        html += `
          <div class="forecast-row" onclick="showDayDetail(${i})">
            <div class="forecast-day">${dayName}</div>
            <div class="forecast-wave">${Math.round(waveHeight)}-${Math.round(waveHeight + 2)}ft</div>
            <div class="forecast-details">
              <span>📊 ${Math.round(period)}s</span>
              <span>💨 ${Math.round(windSpeed)}mph</span>
            </div>
            <div class="forecast-rating ${getRatingClass(rating)}">${rating}</div>
          </div>
        `;
      }
      
      container.innerHTML = html;
    }
    
    // UPDATE TIDES
    function updateTides() {
      const now = new Date();
      const hours = now.getHours();
      
      const highTideHour = hours < 9 ? 10 : hours < 15 ? 16 : 22;
      const lowTideHour = hours < 9 ? 4 : hours < 15 ? 10 : 16;
      
      const highTide = new Date(now);
      highTide.setHours(highTideHour, 0, 0);
      
      const lowTide = new Date(now);
      lowTide.setHours(lowTideHour, 0, 0);
      
      document.getElementById('highTideTime').textContent = formatTime(highTide);
      document.getElementById('highTideHeight').textContent = '4.2ft';
      document.getElementById('lowTideTime').textContent = formatTime(lowTide);
      document.getElementById('lowTideHeight').textContent = '0.8ft';
    }
    
    // SET ACTIVE NAV
    function setActiveNav(element, nav) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');
    }
    
    // SHOW DETAILS (placeholder functions)
    function showConditionDetail(type) {
      alert(`${type.toUpperCase()} details coming soon!`);
    }
    
    function showHourDetail(hour) {
      alert(`Hour ${hour}:00 details coming soon!`);
    }
    
    function showDayDetail(day) {
      alert(`Day ${day} details coming soon!`);
    }
    
    // INIT
    function init() {
      renderSpotSelector();
      updateAll();
      
      // Auto-refresh every 30 minutes
      setInterval(() => {
        currentHour = new Date().getHours();
        updateAll();
      }, 30 * 60 * 1000);
    }
    
    // START
    init();
  </script>
</body>
</html>
